app = "tryonready-demo"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_URLS = "http://0.0.0.0:8080"
  Persistence__Provider = "Postgres"
  PrivateStorage__RootPath = "/data/private"
  YouCam__Enabled = "false"
  YouCam__SimulationEnabled = "true"
  YouCam__SimulationResultPath = "/app/replay/controlled-youcam-ai-clothes-v3-marisol-moonlight.jpg"

[[mounts]]
  source = "tryonready_demo_data"
  destination = "/data"

[deploy]
  release_command = "migrate"
  strategy = "immediate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[restart]]
  policy = "on-failure"
  retries = 10
